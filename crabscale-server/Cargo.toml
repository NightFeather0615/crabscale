[package]
name = "crabscale-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
crabscale-control = { path = "../crabscale-control" }
crabscale-derp = { path = "../crabscale-derp" }
crabscale-proto = { path = "../crabscale-proto" }
crabscale-transport = { path = "../crabscale-transport" }
bytes = "1"
clap = { version = "4", features = ["derive"] }
h2 = "0.4"
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["server", "tokio"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "rt-multi-thread", "macros", "sync", "signal", "time"] }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
url = "2"
ureq = "3"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
ipnet = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
toml = "0.8"
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "tokio", "webpki-roots"] }
futures = "0.3"

[dev-dependencies]
base64 = "0.22"
crabscale-policy = { path = "../crabscale-policy" }
rcgen = "0.13"
rustls-pki-types = "1"
