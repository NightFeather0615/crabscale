# cargo-deny configuration (M4-02 security hardening, #25).
#
# The CI `deny` job runs `cargo deny check` with this file. Advisories and
# banned/source policy are enforced; the `[licenses]` section is intentionally
# omitted so license compliance is not gated here (the `licenses.default`
# severity key was removed in newer cargo-deny).

[advisories]
yanked = "warn"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
