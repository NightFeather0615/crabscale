# cargo-deny configuration (M4-02 security hardening, #25).
#
# The CI `deny` job runs `cargo deny check` with this file. Advisories and
# sources are enforced strictly; licenses are reported (warn) so a newly
# pulled dependency never fails a build for an unrecognized license until the
# allow-list is extended deliberately.

[advisories]
yanked = "warn"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
default = "warn"
# Permissive licenses used across the workspace dependency tree. A dependency
# with an unlisted (but still permissive) license generates a warning, not a
# failure, so `cargo deny check licenses` stays green unless an actual policy
# violation is configured here.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
