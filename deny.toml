# cargo-deny configuration (M4-02 security hardening, #25).
#
# The CI `deny` job runs `cargo deny check advisories bans sources` with this
# file. The license check is intentionally not gated here: the workspace
# crates are path-only and unlicensed, and scoping to advisories/bans/sources
# keeps the job focused on dependency-security policy.

[advisories]
yanked = "warn"
ignore = [
    # RUSTSEC-2023-0071: the `rsa` crate (pulled in by `jsonwebtoken` for OIDC
    # RS256 verification) has no patched release upstream yet
    # (https://github.com/RustCrypto/RSA/issues/626). Tracked and documented
    # in SECURITY.md; re-evaluate when a constant-time release lands.
    "RUSTSEC-2023-0071",
]

[bans]
multiple-versions = "warn"
# Workspace crates depend on each other by `path` without a version, which
# cargo-deny classifies as wildcards; keep them as warnings instead of errors.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
