name: CI

on:
  push:
    branches: ["master"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Cargo caching uses Swatinem/rust-cache@v2, which keys on the runner OS,
# Cargo.lock, and the active Rust toolchain. A toolchain or dependency bump
# therefore produces a new cache key instead of reusing stale artifacts.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run M0-05 smoke test
        run: ./scripts/smoke-test.sh

  harness:
    name: Client compatibility harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run M1-07 end-to-end harness
        run: ./scripts/harness.sh --report harness-report.md
      - name: Upload harness report
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: harness-report.md
