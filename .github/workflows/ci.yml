name: CI

on:
  push:
    branches: ["master"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Cargo caching uses Swatinem/rust-cache@v2, which keys on the runner OS,
# Cargo.lock, and the active Rust toolchain. A toolchain or dependency bump
# therefore produces a new cache key instead of reusing stale artifacts. The
# cache also covers ~/.cargo/bin so cargo-installed tools such as cargo-audit
# and cargo-deny are reused across runs of the audit/deny jobs.
jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run M0-05 smoke test
        run: ./scripts/smoke-test.sh

  perf-smoke:
    name: Performance smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run M3-04 performance smoke
        run: ./scripts/perf-smoke.sh --report perf-smoke-report.md
      - name: Upload performance smoke report
        uses: actions/upload-artifact@v6
        with:
          name: perf-smoke-report
          path: perf-smoke-report.md

  harness:
    name: Client compatibility harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run M1-07 end-to-end harness
        run: ./scripts/harness.sh --report harness-report.md
      - name: Upload harness report
        uses: actions/upload-artifact@v6
        with:
          name: harness-report
          path: harness-report.md

  capability-matrix:
    name: Capability version matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run M4-01 capability version matrix
        run: ./scripts/capability-matrix.sh --report capability-matrix.md
      - name: Upload capability matrix report
        uses: actions/upload-artifact@v6
        with:
          name: capability-matrix-report
          path: capability-matrix.md

  audit:
    name: Dependencies audit (cargo audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - name: Cache Cargo registry, build artifacts, and cargo-audit
        uses: Swatinem/rust-cache@v2
      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071 (rsa via jsonwebtoken) has no patched release;
          # tracked in deny.toml / audit.toml and SECURITY.md.
          ignore: RUSTSEC-2023-0071

  deny:
    name: Dependencies deny (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache Cargo registry, build artifacts, and cargo-deny
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run cargo deny
        run: cargo deny --all-features check advisories bans sources

  fuzz-smoke:
    name: Fuzz smoke (M4-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run M4-02 fuzz smoke
        run: ./scripts/fuzz-smoke.sh

  reverse-proxy-smoke:
    name: Reverse-proxy smoke (M4-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run M4-03 reverse-proxy smoke
        run: ./scripts/reverse-proxy-smoke.sh

  docker-smoke:
    name: Docker image smoke (M4-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run M4-03 container smoke
        run: ./scripts/docker-smoke.sh

  backup-smoke:
    name: Backup/restore smoke (M4-04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run M4-04 backup/restore smoke
        run: ./scripts/backup-smoke.sh

  observability-smoke:
    name: Observability smoke (M4-04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run M4-04 observability smoke
        run: ./scripts/observability-smoke.sh
