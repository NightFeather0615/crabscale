# Example deployment for crabscale-server behind a TLS-terminating reverse
# proxy.
#
# Mode shown here: Caddy terminates HTTPS on 443/80 and forwards to the
# container's plain HTTP listener on 8080, setting X-Forwarded-For. The server
# trusts the private Docker network so its /ts2021 rate limiter keys on the
# real client IP. Swap in your own nginx/traefik config equivalently.
#
# For direct TLS serve the server's own rustls instead (see
# deploy/crabscale.toml.example: tls.mode = "files" or "acme").
#
# Usage:
#   docker compose up -d --build
#   curl -k https://localhost/key?v=130

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - crabscale

  crabscale:
    build:
      context: .
    image: crabscale:latest
    restart: unless-stopped
    # Only Caddy reaches 8080; nothing else publishes it.
    expose:
      - "8080"
      - "3478/udp"
    volumes:
      # The machine key + SQLite database persist across restarts here.
      - crabscale_data:/var/lib/crabscale/data
      - ./deploy/crabscale.toml:/var/lib/crabscale/crabscale.toml:ro
    command: ["--config", "/var/lib/crabscale/crabscale.toml"]
    environment:
      CRABSCALE_TRUSTED_PROXIES: "172.16.0.0/12, 10.0.0.0/8, 127.0.0.1/32"
      # Example environment override (wins over the config file):
      # CRABSCALE_STUN_PORT: "0"

volumes:
  crabscale_data:
  caddy_data:
  caddy_config:
