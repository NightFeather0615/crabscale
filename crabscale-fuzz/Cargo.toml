[package]
name = "crabscale-fuzz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Fuzz-suite smoke targets for crabscale parsers (M4-02, #25)"

[dependencies]
bytes = "1"
crabscale-derp = { path = "../crabscale-derp" }
crabscale-proto = { path = "../crabscale-proto" }
crabscale-transport = { path = "../crabscale-transport" }
serde_json = "1"

[[bin]]
name = "json_fuzz"
path = "src/json_fuzz.rs"

[[bin]]
name = "noise_fuzz"
path = "src/noise_fuzz.rs"

[[bin]]
name = "derp_fuzz"
path = "src/derp_fuzz.rs"
