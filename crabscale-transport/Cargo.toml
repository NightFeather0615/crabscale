[package]
name = "crabscale-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
crabscale-proto = { path = "../crabscale-proto" }
base64 = "0.22"
blake2 = "0.10"
bytes = "1"
chacha20poly1305 = "0.10"
h2 = "0.4"
hkdf = "0.12"
http = "1"
rand = "0.8"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "rt", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
